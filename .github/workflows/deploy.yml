name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, claude/brave-franklin-bwciwh]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skips automatically until the two Cloudflare secrets are configured.
    if: ${{ github.repository_owner != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploying with --branch=main publishes to the production *.pages.dev URL.
          command: pages deploy dist --project-name=andrea-jason-wedding-guide --branch=main
