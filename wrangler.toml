# Cloudflare config — serves Astro's static ./dist output as a
# static-assets Worker. The connected Cloudflare Git build runs
# `npx wrangler deploy`, which uploads ./dist directly (no server code).
#
# Local deploy:
#   npm install
#   npm run build            # produces ./dist
#   npx wrangler login       # one-time
#   npx wrangler deploy      # publishes to <name>.<your-subdomain>.workers.dev

name = "andrea-jason-wedding-guide"
compatibility_date = "2025-03-01"

[assets]
directory = "./dist"
# Serve the built 404 page for unknown paths.
not_found_handling = "404-page"
