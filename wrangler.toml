# Cloudflare Pages config — serves Astro's static `dist/` output.
#
# Quick start (local, with a Cloudflare API token):
#   npm install
#   npm run build                       # produces ./dist
#   CLOUDFLARE_API_TOKEN=...  CLOUDFLARE_ACCOUNT_ID=...  npx wrangler pages deploy
#
# Or connect this repo in the Cloudflare Pages dashboard with:
#   Build command:    npm run build
#   Output directory: dist

name = "andrea-jason-wedding-guide"   # TODO: this becomes the *.pages.dev subdomain
pages_build_output_dir = "dist"
compatibility_date = "2025-03-01"
